name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: add a repo secret STATS_PAT (classic PAT with `repo` + `read:user`)
      # to include private repositories. Without it, GITHUB_TOKEN counts public repos only.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=llabans&show_icons=true&count_private=true&include_all_commits=true&bg_color=0d1117&title_color=a855f7&text_color=e5e7eb&icon_color=4ade80&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=llabans&layout=compact&langs_count=8&hide=html,css&bg_color=0d1117&title_color=4ade80&text_color=e5e7eb&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
